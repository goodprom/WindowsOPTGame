; ============================================================
;  WindowsOPTGame - файл русского языка
; ------------------------------------------------------------
;  Формат: заголовки [Секция], далее пары Ключ=Значение.
;  Строки, начинающиеся с ;  - комментарии.
;
;  ПРАВИЛА для переводчиков:
;   - Имена ключей не менять - переводить только ЗНАЧЕНИЯ.
;   - В значениях запрещены символы: процент, амперсанд,
;     угловые скобки, вертикальная черта, восклицательный
;     знак, круглые скобки, кавычки, циркумфлекс, знак равно.
;   - Отсутствующие ключи автоматически берутся из английского.
;   - Сохранять файл в UTF-8 без BOM.
; ============================================================

