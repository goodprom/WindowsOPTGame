[About]
Title=About
Line1=A safe, modular, fully-logged optimization suite for Windows 10/11 x64.
PrinciplesHdr=Design principles
P1=- Every system change is preceded by a restore point and registry backup.
P2=- Only documented Windows commands are used - no fake tweaks.
P3=- Defender, Windows Update and critical services are never disabled.
P4=- User files - Documents, Desktop, Downloads - are never touched.
P5=- Everything is reversible via menu item 11, Restore Previous Settings.
FoldersHdr=Folders
F1=Logs\     - one log per session or module
F2=Backups\  - registry exports, service snapshots, config backups
F3=Config\   - settings.ini and language selection
F4=Tools\    - optional: place Sysinternals RAMMap64.exe here
Rights=All rights reserved. Made with care for gamers.

