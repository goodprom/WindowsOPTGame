; ============================================================
;  WindowsOPTGame - English language file
; ------------------------------------------------------------
;  Format : [Section] headers, then Key=Value pairs.
;  Lines starting with ; are comments.
;
;  RULES for translators:
;   - Keep every Key name exactly as it is - translate VALUES only.
;   - Never use these characters in values (they break batch):
;       percent, ampersand, angle brackets, pipe, exclamation
;       mark, parentheses, quotes, caret, equals sign.
;   - Missing keys automatically fall back to English.
;   - Save the file as UTF-8 without BOM.
;
;  To add a new language: copy this file to <code>.ini in this
;  folder, set Name= below and translate. It appears in the
;  Settings menu automatically - no code changes needed.
; ============================================================

