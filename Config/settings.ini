; WindowsOPTGame configuration
; 1 = enabled, 0 = disabled
AskConfirmation=1
CleanEventLogs=0
CleanBrowserCache=0
CleanRecycleBin=1
DisableGameBar=1
DisableBackgroundRecording=1
CloseBackgroundApps=1
RunChkdskInFullOptimization=1
ApplyMMCSSTweaks=1
DisableNetworkThrottling=1
EnableHAGS=1
DisablePowerThrottling=1
SetUltimatePerformancePower=1
; Comma-separated list of non-essential processes Gaming Mode may close
BackgroundApps=OneDrive.exe,PhoneExperienceHost.exe,YourPhone.exe,GameBarFTServer.exe
Language=ru
SetHighPerformancePower=0
